name: snake-contribution-graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2367E8F9&color_dots=%231E293B,%23164E63,%230E7490,%230891B2,%2338BDF8
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2367E8F9&color_dots=%231E293B,%23164E63,%230E7490,%230891B2,%2338BDF8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
