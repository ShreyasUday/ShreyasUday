<svg width="1400" height="320" viewBox="0 0 1400 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="blurBlob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1400" height="320" fill="url(#bg)"/>

  <!-- soft glow blobs for depth (glassmorphism backdrop) -->
  <circle cx="150" cy="55" r="140" fill="#38BDF8" opacity="0.16" filter="url(#blurBlob)"/>
  <circle cx="1270" cy="270" r="180" fill="#67E8F9" opacity="0.13" filter="url(#blurBlob)"/>
  <circle cx="760" cy="0" r="120" fill="#38BDF8" opacity="0.09" filter="url(#blurBlob)"/>

  <!-- frosted glass panel -->
  <rect x="60" y="46" width="1280" height="228" rx="20" fill="#F8FAFC" opacity="0.045" stroke="#F8FAFC" stroke-opacity="0.10" stroke-width="1.2"/>
  <rect x="60" y="46.5" width="1280" height="1" fill="#F8FAFC" opacity="0.18"/>

  <!-- content -->
  <text x="100" y="145" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#F8FAFC">Shreyas Uday</text>
  <text x="100" y="192" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="url(#accentText)">Backend Engineer — Systems, APIs &amp; Infrastructure</text>

  <rect x="100" y="215" width="72" height="3" rx="1.5" fill="url(#accentText)"/>
</svg>
